<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Academic Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #23262a;
    --bg-elevated: #2d3136;
    --bg-elevated-2: #363b41;
    --border: #40454c;
    --text: #edf0f2;
    --text-dim: #a4abb3;
    --accent: #6fa981;
    --accent-hover: #80bb92;
    --accent-text: #10231a;
    --wrong: #c17272;
    --wrong-bg: #3a2c2c;
    --correct-bg: #253a2d;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f5f4;
    --bg-elevated: #ffffff;
    --bg-elevated-2: #eceeec;
    --border: #d8dbd8;
    --text: #1d201f;
    --text-dim: #5a615c;
    --accent: #3f7a58;
    --accent-hover: #366a4c;
    --accent-text: #ffffff;
    --wrong: #a4413f;
    --wrong-bg: #f6e4e3;
    --correct-bg: #e3efe6;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #23262a;
      --bg-elevated: #2d3136;
      --bg-elevated-2: #363b41;
      --border: #40454c;
      --text: #edf0f2;
      --text-dim: #a4abb3;
      --accent: #6fa981;
      --accent-hover: #80bb92;
      --accent-text: #10231a;
      --wrong: #c17272;
      --wrong-bg: #3a2c2c;
      --correct-bg: #253a2d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100%;
  }

  body {
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
  }

  header.top h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header.top .sub {
    color: var(--text-dim);
    font-size: 0.92rem;
  }

  /* ---------- Home: collection list ---------- */

  .collections {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .collection-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .collection-card .info h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .collection-card .info .meta {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .collection-card .action {
    flex-shrink: 0;
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  /* ---------- Buttons ---------- */

  button {
    font-family: var(--font);
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 10px 18px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--bg-elevated-2); }
  .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-text {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px 4px;
    font-weight: 500;
  }
  .btn-text:hover { color: var(--text); }

  /* ---------- Quiz screen ---------- */

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .quiz-header .progress-label {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .progress-track {
    height: 5px;
    background: var(--bg-elevated-2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .2s ease;
  }

  .question-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }

  .option {
    text-align: left;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 13px 16px;
    font-weight: 500;
    font-size: 0.96rem;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .option.selected {
    border-color: var(--accent);
    background: var(--bg-elevated-2);
  }

  .option.correct {
    border-color: var(--accent);
    background: var(--correct-bg);
  }

  .option.incorrect {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }

  .option.missed {
    border-color: var(--accent);
    border-style: dashed;
    background: transparent;
  }

  .option:disabled {
    cursor: default;
  }

  .option-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .option-box {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border-radius: 4px;
    border: 1.5px solid var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
  }

  .option.selected .option-box {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }

  .option.correct .option-box {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }

  .option.incorrect .option-box {
    border-color: var(--wrong);
    background: var(--wrong);
    color: #fff;
  }

  .option.missed .option-box {
    border-color: var(--accent);
    color: var(--accent);
  }

  .option-box.round {
    border-radius: 50%;
  }

  .question-hint {
    color: var(--text-dim);
    font-size: 0.84rem;
    margin: -12px 0 18px;
  }

  .quiz-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 22px;
    gap: 10px;
  }

  /* ---------- Results screen ---------- */

  .results-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 26px;
    text-align: center;
  }

  .results-score {
    font-size: 2.4rem;
    font-weight: 800;
    margin: 6px 0 2px;
  }

  .results-score span {
    font-size: 1.2rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .results-label {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin-bottom: 22px;
  }

  .results-breakdown {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 28px;
    font-size: 0.87rem;
    color: var(--text-dim);
  }

  .results-breakdown b {
    color: var(--text);
    font-size: 1.05rem;
    display: block;
  }

  .results-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hidden { display: none !important; }

  /* ---------- Exam setup ---------- */

  .exam-cta {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .exam-cta .info h2 {
    font-size: 1.02rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .exam-cta .info .meta {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .exam-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .exam-toolbar .links {
    display: flex;
    gap: 14px;
  }

  .exam-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 22px;
  }

  .exam-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .exam-item:hover {
    border-color: var(--accent);
  }

  .exam-item .option-box {
    margin-top: 0;
  }

  .exam-item .exam-item-title {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .exam-item .exam-item-meta {
    color: var(--text-dim);
    font-size: 0.82rem;
  }

  .exam-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  footer.back-link {
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div>
      <h1 id="page-title">Teste Academic Hub</h1>
      <div class="sub" id="page-sub">Alege o colecție de întrebări</div>
    </div>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home">
    <div class="exam-cta">
      <div class="info">
        <h2>Examen personalizat</h2>
        <div class="meta">Alege ce colecții intră în test</div>
      </div>
      <div class="action">
        <button class="btn-primary" id="btn-open-exam-setup">Examen</button>
      </div>
    </div>
    <div class="collections" id="collections-list"></div>
  </div>

  <!-- EXAM SETUP SCREEN -->
  <div id="screen-exam-setup" class="hidden">
    <div class="exam-toolbar">
      <div class="links">
        <button class="btn-text" id="btn-exam-select-all">Selectează tot</button>
        <button class="btn-text" id="btn-exam-select-none">Deselectează tot</button>
      </div>
      <button class="btn-text" id="btn-exam-cancel">Anulează</button>
    </div>
    <div class="exam-list" id="exam-list"></div>
    <div class="exam-footer">
      <div class="meta" id="exam-selection-summary" style="color: var(--text-dim); font-size: 0.87rem;"></div>
      <button class="btn-primary" id="btn-exam-generate" disabled>Generează examenul</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-header">
      <div class="progress-label" id="quiz-progress-label"></div>
      <button class="btn-text" id="btn-exit">Acasă</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="question-card">
      <p class="question-text" id="question-text"></p>
      <p class="question-hint" id="question-hint">Poți alege una sau mai multe variante.</p>
      <div class="options" id="options-list"></div>
    </div>

    <div class="quiz-actions">
      <button class="btn-secondary" id="btn-prev">Înapoi</button>
      <button class="btn-primary" id="btn-check">Verifică</button>
      <button class="btn-secondary" id="btn-next">Înainte</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="hidden">
    <div class="results-card">
      <div class="results-label" id="results-collection-name"></div>
      <div class="results-score"><span id="results-score-num">0</span><span> / <span id="results-score-total">0</span> corecte</span></div>
      <div class="results-breakdown">
        <div><b id="results-correct">0</b>corecte</div>
        <div><b id="results-wrong">0</b>greșite</div>
        <div><b id="results-unanswered">0</b>nefăcute</div>
      </div>
      <div class="results-actions">
        <button class="btn-primary" id="btn-redo-all">Reia testul integral</button>
        <button class="btn-secondary" id="btn-redo-mistakes">Reia doar greșite / nefăcute</button>
        <button class="btn-text" id="btn-results-exit">Înapoi la colecții</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   DATE TESTE
   -------------------------------------------------------------------------
   Fiecare colecție are un id unic, un titlu și o listă de întrebări.
   O întrebare are: id unic (în cadrul colecției), text, și o listă "options",
   fiecare opțiune fiind { text: "...", correct: true/false }. O întrebare
   poate avea una SAU mai multe variante corecte.
   ========================================================================= */

const COLLECTIONS = [{"id": "colectia-1", "title": "Colecția 1", "questions": [{"id": "q1", "text": "Selectaţi indicaţiile absolute pentru efectuarea amputării.", "options": [{"text": "Dezmembrare totală sau incompletă în diverse traumatizări", "correct": true}, {"text": "Leziuni grave deschise ale membrelor cu imense distrucţii osoase, musculocutanate şi vasculare", "correct": true}, {"text": "Gangrena ischemică a segmentului de diversă geneză", "correct": true}, {"text": "Proces grav infecţios local la un segment al membrelor ce prezintă pericol pentru viaţa bolnavului", "correct": true}, {"text": "Tumori benigne", "correct": false}]}, {"id": "q2", "text": "Selectaţi indicaţiile relative pentru efectuarea amputării", "options": [{"text": "Ulcere neurotrofice, incurabile", "correct": true}, {"text": "Osteomielită cronică cu pericol de amiloidoză", "correct": true}, {"text": "Consecinţe grave cu diformităţi incurabile posttraumatice şi paralitice", "correct": true}, {"text": "Afecţiuni tuberculoase grave în regiunea articulaţiilor unui membru", "correct": true}, {"text": "Anomalii congenitale care nu pot fi corejate ortopedic", "correct": false}]}, {"id": "q4", "text": "Notaţi grupele de preparate folosite în tratamentul medicamentos al AR:", "options": [{"text": "antibiotice", "correct": false}, {"text": "citostatici", "correct": true}, {"text": "antiinflamatorii nesteroidiene", "correct": true}, {"text": "corticosteroizi", "correct": true}, {"text": "hinolizi", "correct": true}]}, {"id": "q5", "text": "Invazia căror germeni microbiani poate servi ca factor etiologic a sindromului Reiter?", "options": [{"text": "Shigella", "correct": true}, {"text": "Salmonella", "correct": true}, {"text": "Campylolobacter", "correct": true}, {"text": "Trihomonas vaginalis", "correct": false}, {"text": "Hlamydia trahomatis", "correct": true}]}, {"id": "q6", "text": "Tratamentul funcţional a fracturilor tasate stabile de corp vertebral subîntelege:", "options": [{"text": "Tratament chirurgical de stabilizare", "correct": false}, {"text": "Tracţiune pe platou înclinat", "correct": false}, {"text": "Masaj şi gimnastică curativă din primele zile după traumatizm pentru întărirea \"carcasului muscular a bolnavului\"", "correct": true}, {"text": "Aplicarea corsetului ghipsat", "correct": false}, {"text": "Reducerea unimomentană a fracturii şi imobilizare cu corset ghipsat", "correct": false}]}, {"id": "q7", "text": "De care formaţiuni anatomice este asigurată stabilitatea segmentului vertebral:", "options": [{"text": "Aparatul capsulo-ligamentar şi muscular coloanei vertebrale", "correct": true}, {"text": "Discurile intervertebrale", "correct": true}, {"text": "Ligamentul longitudinal anterior şi capsula articulară", "correct": true}, {"text": "Ligamentele supra şi intraspinoase", "correct": true}, {"text": "Ligamentul rotund", "correct": false}]}, {"id": "q9", "text": "Luxaţia de atlant numită ”transligamentară” se produce în caz de?", "options": [{"text": "Fractura procesului odontoid a vertebrei C2", "correct": false}, {"text": "Fractură-luxaţie tip \"călău\" C2", "correct": false}, {"text": "Leziunea ligamentului transversal a atlantului", "correct": true}, {"text": "Leziunea ligamentului longitudinal anterior", "correct": false}, {"text": "Leziunea ligamentului nucal", "correct": false}]}, {"id": "q10", "text": "Ce tratament se recomandă pacienţilor ce suferă de torticolis muscular", "options": [{"text": "Gimnastică medicală", "correct": true}, {"text": "Masaj a musculaturii feţei şi a porţiunii cervicale a coloanei vertebrale", "correct": true}, {"text": "Proceduri fizioterapeutice", "correct": true}, {"text": "Aplicarea aparatului gipsat toracocranian", "correct": true}, {"text": "Tracţie cu ajutorul ansei Glison", "correct": false}]}, {"id": "q11", "text": "Leziuni stabile a coloanei vertebrale sunt considerate:", "options": [{"text": "Fracturi tasate de corp vertibaral gr.I, fără fractura lamei vertebrale, tip A1 și A2", "correct": true}, { const STORAGE_KEY = "quiz-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    /* localStorage indisponibil — progresul nu va persista, dar aplicația funcționează */
  }
}

let progress = loadProgress();
let examProgressStore = {};

function getCollectionProgress(collectionId) {
  const store = state.isExam ? examProgressStore : progress;
  if (!store[collectionId]) store[collectionId] = {};
  return store[collectionId];
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSession(questions) {
  return shuffleArray(questions).map(q => ({
    id: q.id,
    text: q.text,
    options: shuffleArray(q.options)
  }));
}

// ---- state ----
let state = {
  collection: null,
  session: null,      // array of question objects for the current run
  index: 0,
  selected: [],        // indices of options chosen for the current question
  checked: false,
  isExam: false
};

const screens = {
  home: document.getElementById("screen-home"),
  examSetup: document.getElementById("screen-exam-setup"),
  quiz: document.getElementById("screen-quiz"),
  results: document.getElementById("screen-results")
};

function showScreen(name) {
  Object.keys(screens).forEach(k => screens[k].classList.toggle("hidden", k !== name));
}

function setHeader(title, sub) {
  document.getElementById("page-title").textContent = title;
  document.getElementById("page-sub").textContent = sub;
}

function renderHome() {

  list.innerHTML = "";

  if (COLLECTIONS.length === 0) {
    list.innerHTML = '<div class="empty-state">Nu există încă nicio colecție de teste.</div>';

    const cp = getCollectionProgress(col.id);
    const total = col.questions.length;
    const answered = Object.keys(cp).length;

    let metaText = total + " de întrebări";

      buttonText = answered >= total ? "Reia" : "Continuă";
    }

    const card = document.createElement("div");
    card.className = "collection-card";
    card.innerHTML = `
      <div class="info">
        <h2>${escapeHtml(col.title)}</h2>
        <div class="meta">${metaText}</div>
      </div>
      <div class="action">
        <button class="btn-primary btn-start">${buttonText}</button>
      </div>
    `;
    card.querySelector(".btn-start").addEventListener("click", () => startCollection(col));
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------------------------------------------------------------------
// QUIZ
// ---------------------------------------------------------------------

function startCollection(col, questionSubset) {
  state.collection = col;
  state.session = buildSession(questionSubset || col.questions);
  state.index = 0;
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = state.session[state.index];
  const cp = getCollectionProgress(state.collection.id);
  const saved = cp[q.id];

  state.selected = saved ? saved.selected.slice() : [];
  state.checked = !!saved;

  document.getElementById("quiz-progress-label").textContent =
    "Întrebarea " + (state.index + 1) + " din " + state.session.length + " — " + state.collection.title;
  document.getElementById("progress-fill").style.width =
    Math.round(((state.index) / state.session.length) * 100) + "%";

  document.getElementById("question-text").textContent = q.text;
  const isSingle = q.options.filter(o => o.correct).length === 1;
  document.getElementById("question-hint").textContent = isSingle
    ? "Alege o singură variantă."
    : "Poți alege una sau mai multe variante.";

  const optsWrap = document.getElementById("options-list");
  optsWrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = '<span class="option-row"><span class="option-box' + (isSingle ? ' round' : '') + '">✓</span><span></span></span>';
    btn.querySelector(".option-row > span:last-child").textContent = opt.text;
    btn.addEventListener("click", () => selectOption(i));
    optsWrap.appendChild(btn);
  });

  document.getElementById("btn-prev").disabled = state.index === 0;
  document.getElementById("btn-next").textContent =
    state.index === state.session.length - 1 ? "Finalizează" : "Înainte";

  applyOptionStyles();
}

function selectOption(i) {
  if (state.checked) return; // already verified, locked until moving to another question
  const q = state.session[state.index];
  const isSingle = q.options.filter(o => o.correct).length === 1;
  if (isSingle) {
    state.selected = [i];
  } else {
    const pos = state.selected.indexOf(i);
    if (pos === -1) state.selected.push(i);
    else state.selected.splice(pos, 1);
  }
  applyOptionStyles();
}

function applyOptionStyles() {
  const q = state.session[state.index];
  const opts = document.querySelectorAll("#options-list .option");
  opts.forEach((btn, i) => {
    btn.classList.remove("selected", "correct", "incorrect", "missed");
    btn.disabled = state.checked;
    const isSelected = state.selected.includes(i);
    const isCorrectOpt = q.options[i].correct;
    if (state.checked) {
      if (isCorrectOpt && isSelected) btn.classList.add("correct");
      else if (isCorrectOpt && !isSelected) btn.classList.add("missed");
      else if (!isCorrectOpt && isSelected) btn.classList.add("incorrect");
    } else if (isSelected) {
      btn.classList.add("selected");
    }
  });
  document.getElementById("btn-check").disabled = state.checked;
}

function isAnswerCorrect(q, selected) {
  const correctIdx = q.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1);
  if (correctIdx.length !== selected.length) return false;
  const sortedSel = selected.slice().sort();
  const sortedCorrect = correctIdx.slice().sort();
  return sortedSel.every((v, i) => v === sortedCorrect[i]);
}

function persistIfNeeded() {
  if (!state.isExam) saveProgress(progress);
}

document.getElementById("btn-check").addEventListener("click", () => {
  if (state.checked) return;
  const q = state.session[state.index];
  const cp = getCollectionProgress(state.collection.id);
  // Dacă nu a fost aleasă nicio variantă, întrebarea se marchează automat ca greșită.
  cp[q.id] = { selected: state.selected.slice(), correct: isAnswerCorrect(q, state.selected) };
  persistIfNeeded();
  state.checked = true;
  applyOptionStyles();
});

document.getElementById("btn-prev").addEventListener("click", () => {
  if (state.index === 0) return;
  state.index -= 1;
  renderQuestion();
});

document.getElementById("btn-next").addEventListener("click", () => {
  if (state.index === state.session.length - 1) {
    showResults();
  } else {
    state.index += 1;
    renderQuestion();
  }
});

document.getElementById("btn-exit").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

// ---------------------------------------------------------------------
// RESULTS
// ---------------------------------------------------------------------

function showResults() {
  const col = state.collection;
  const cp = getCollectionProgress(col.id);
  const total = col.questions.length;
  let correct = 0, wrong = 0;
  col.questions.forEach(q => {
    const a = cp[q.id];
    if (a) { a.correct ? correct++ : wrong++; }
  });
  const unanswered = total - correct - wrong;

  document.getElementById("results-collection-name").textContent = col.title;
  document.getElementById("results-score-num").textContent = correct;
  document.getElementById("results-score-total").textContent = total;
  document.getElementById("results-correct").textContent = correct;
  document.getElementById("results-wrong").textContent = wrong;
  document.getElementById("results-unanswered").textContent = unanswered;

  const redoMistakesBtn = document.getElementById("btn-redo-mistakes");
  redoMistakesBtn.disabled = (wrong + unanswered) === 0;
  redoMistakesBtn.style.display = (wrong + unanswered) === 0 ? "none" : "block";

  setHeader("Teste Academic Hub", "Rezultatele tale");
  showScreen("results");
}

document.getElementById("btn-redo-all").addEventListener("click", () => {
  const col = state.collection;
  if (state.isExam) {
    examProgressStore[col.id] = {};
  } else {
    progress[col.id] = {};
    saveProgress(progress);
  }
  startCollection(col);
});

document.getElementById("btn-redo-mistakes").addEventListener("click", () => {
  const col = state.collection;
  const cp = getCollectionProgress(col.id);
  const subset = col.questions.filter(q => !cp[q.id] || !cp[q.id].correct);
  if (subset.length === 0) return;
  startCollection(col, subset);
});

document.getElementById("btn-results-exit").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

// ---------------------------------------------------------------------
// EXAM SETUP
// ---------------------------------------------------------------------

let examSelection = new Set();

document.getElementById("btn-open-exam-setup").addEventListener("click", () => {
  examSelection = new Set();
  renderExamSetup();
  showScreen("examSetup");
  setHeader("Examen personalizat", "Alege ce colecții vrei să includă examenul");
});

document.getElementById("btn-exam-cancel").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

document.getElementById("btn-exam-select-all").addEventListener("click", () => {
  COLLECTIONS.forEach(c => examSelection.add(c.id));
  renderExamSetup();
});

document.getElementById("btn-exam-select-none").addEventListener("click", () => {
  examSelection.clear();
  renderExamSetup();
});

function renderExamSetup() {
  const list = document.getElementById("exam-list");
  list.innerHTML = "";
  COLLECTIONS.forEach(col => {
    const item = document.createElement("div");
    item.className = "exam-item";
    const checked = examSelection.has(col.id);
    item.innerHTML = `
      <span class="option-box${checked ? ' selected' : ''}" style="border-color: ${checked ? 'var(--accent)' : 'var(--text-dim)'}; background: ${checked ? 'var(--accent)' : 'transparent'}; color: ${checked ? 'var(--accent-text)' : 'transparent'};">✓</span>
      <span>
        <div class="exam-item-title">${escapeHtml(col.title)}</div>
        <div class="exam-item-meta">${col.questions.length} de întrebări</div>
      </span>
    `;
    item.addEventListener("click", () => {
      if (examSelection.has(col.id)) examSelection.delete(col.id);
      else examSelection.add(col.id);
      renderExamSetup();
    });
    list.appendChild(item);
  });

  const count = examSelection.size;
  const totalQuestions = COLLECTIONS.filter(c => examSelection.has(c.id))
    .reduce((sum, c) => sum + c.questions.length, 0);
  document.getElementById("exam-selection-summary").textContent =
    count === 0 ? "Nicio colecție selectată" : count + " colecții selectate · " + totalQuestions + " întrebări";
  document.getElementById("btn-exam-generate").disabled = count === 0;
}

document.getElementById("btn-exam-generate").addEventListener("click", () => {
  const selectedCols = COLLECTIONS.filter(c => examSelection.has(c.id));
  if (selectedCols.length === 0) return;
  const allQuestions = [];
  selectedCols.forEach(c => allQuestions.push(...c.questions));

  const examCollection = {
    id: "examen",
    title: "Examen (" + selectedCols.length + " colecții, " + allQuestions.length + " întrebări)",
    questions: allQuestions
  };

  examProgressStore = { examen: {} };
  state.isExam = true;
  startCollection(examCollection);
});

// ---------------------------------------------------------------------
renderHome();
showScreen("home");
</script>
