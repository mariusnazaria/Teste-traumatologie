<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Epidemiologie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #23262a;
    --bg-elevated: #2d3136;
    --bg-elevated-2: #363b41;
    --border: #40454c;
    --text: #edf0f2;
    --text-dim: #a4abb3;
    --accent: #6fa981;
    --accent-hover: #80bb92;
    --accent-text: #10231a;
    --wrong: #c17272;
    --wrong-bg: #3a2c2c;
    --correct-bg: #253a2d;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"] {
    --bg: #f4f5f4;
    --bg-elevated: #ffffff;
    --bg-elevated-2: #eceeec;
    --border: #d8dbd8;
    --text: #1d201f;
    --text-dim: #5a615c;
    --accent: #3f7a58;
    --accent-hover: #366a4c;
    --accent-text: #ffffff;
    --wrong: #a4413f;
    --wrong-bg: #f6e4e3;
    --correct-bg: #e3efe6;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #23262a;
      --bg-elevated: #2d3136;
      --bg-elevated-2: #363b41;
      --border: #40454c;
      --text: #edf0f2;
      --text-dim: #a4abb3;
      --accent: #6fa981;
      --accent-hover: #80bb92;
      --accent-text: #10231a;
      --wrong: #c17272;
      --wrong-bg: #3a2c2c;
      --correct-bg: #253a2d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100%;
  }

  body {
    padding: 32px 20px 60px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
  }

  header.top h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header.top .sub {
    color: var(--text-dim);
    font-size: 0.92rem;
  }

  /* ---------- Home: collection list ---------- */

  .collections {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-title { margin: 34px 0 4px; padding-top: 18px; border-top: 2px solid var(--border, #444); font-size: 1.3rem; font-weight: 800; }
  .group-title { margin: 22px 0 6px; font-size: 1.05rem; font-weight: 700; color: var(--accent, #2563eb); }
  .collection-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .collection-card .info h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .collection-card .info .meta {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .collection-card .action {
    flex-shrink: 0;
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  /* ---------- Buttons ---------- */

  button {
    font-family: var(--font);
    font-size: 0.92rem;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 10px 18px;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, opacity .15s ease;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-text);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover { background: var(--bg-elevated-2); }
  .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-text {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px 4px;
    font-weight: 500;
  }
  .btn-text:hover { color: var(--text); }

  /* ---------- Quiz screen ---------- */

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .quiz-header .progress-label {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .progress-track {
    height: 5px;
    background: var(--bg-elevated-2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .2s ease;
  }

  .question-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }

  .option {
    text-align: left;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 13px 16px;
    font-weight: 500;
    font-size: 0.96rem;
    cursor: pointer;
    transition: border-color .15s ease, background-color .15s ease;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
  }

  .option.selected {
    border-color: var(--accent);
    background: var(--bg-elevated-2);
  }

  .option.correct {
    border-color: var(--accent);
    background: var(--correct-bg);
  }

  .option.incorrect {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }

  .option.missed {
    border-color: var(--accent);
    border-style: dashed;
    background: transparent;
  }

  .option:disabled {
    cursor: default;
  }

  .option-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .option-box {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border-radius: 4px;
    border: 1.5px solid var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
  }

  .option.selected .option-box {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }

  .option.correct .option-box {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }

  .option.incorrect .option-box {
    border-color: var(--wrong);
    background: var(--wrong);
    color: #fff;
  }

  .option.missed .option-box {
    border-color: var(--accent);
    color: var(--accent);
  }

  .option-box.round {
    border-radius: 50%;
  }

  .question-hint {
    color: var(--text-dim);
    font-size: 0.84rem;
    margin: -12px 0 18px;
  }

  .question-image {
    margin: 4px 0 18px;
    text-align: center;
  }

  .question-image img {
    max-width: 100%;
    max-height: 420px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #fff;
  }

  .btn-expl { margin-top: 14px; width: 100%; }
  .explanation-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--bg-elevated-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--text);
  }

  .explanation-box .label {
    font-weight: 700;
    color: var(--accent);
    margin-right: 6px;
  }

  .explanation-box .label { display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.78rem; }
  .expl-body p { margin: 0 0 8px; }
  .expl-body p:last-child { margin-bottom: 0; }
  .expl-body ul, .expl-body ol { margin: 4px 0 8px; padding-left: 22px; }
  .expl-body ul ul, .expl-body ol ul, .expl-body ul ol { margin: 2px 0 2px; }
  .expl-body li { margin: 2px 0; }
  .expl-body strong { color: var(--text); font-weight: 700; }
  .expl-cont { margin-top: 2px; }
  .expl-source, .expl-keynote { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 0.82rem; line-height: 1.45; opacity: 0.85; }
  .expl-keynote { border-top: none; margin-top: 6px; padding-top: 0; }
  .expl-tag { font-weight: 700; color: var(--accent); }
  .expl-allvars { margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: var(--correct-bg); border: 1px solid var(--accent); }
  .expl-allvars.hidden { display: none; }
  .expl-allvars-title { font-weight: 700; color: var(--accent); font-size: 0.86rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .expl-allvars-sub { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
  .expl-allvars ul { margin: 4px 0 0; padding-left: 20px; }
  .expl-allvars li { margin: 3px 0; }
  .expl-source.hidden, .expl-keynote.hidden { display: none; }

  .quiz-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 22px;
    gap: 10px;
  }

  /* ---------- Results screen ---------- */

  .results-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 26px;
    text-align: center;
  }

  .results-score {
    font-size: 2.4rem;
    font-weight: 800;
    margin: 6px 0 2px;
  }

  .results-score span {
    font-size: 1.2rem;
    color: var(--text-dim);
    font-weight: 600;
  }

  .results-label {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin-bottom: 22px;
  }

  .results-breakdown {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 28px;
    font-size: 0.87rem;
    color: var(--text-dim);
  }

  .results-breakdown b {
    color: var(--text);
    font-size: 1.05rem;
    display: block;
  }

  .results-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hidden { display: none !important; }

  /* ---------- Exam setup ---------- */

  .exam-cta {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .exam-cta .info h2 {
    font-size: 1.02rem;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .exam-cta .info .meta {
    color: var(--text-dim);
    font-size: 0.87rem;
  }

  .exam-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .exam-toolbar .links {
    display: flex;
    gap: 14px;
  }

  .exam-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 22px;
  }

  .exam-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .exam-item:hover {
    border-color: var(--accent);
  }

  .exam-item .option-box {
    margin-top: 0;
  }

  .exam-item .exam-item-title {
    font-weight: 600;
    font-size: 0.95rem;
  }

  .exam-item .exam-item-meta {
    color: var(--text-dim);
    font-size: 0.82rem;
  }

  .exam-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  footer.back-link {
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div>
      <h1 id="page-title">Teste Academic Hub</h1>
      <div class="sub" id="page-sub">Alege o colecție de întrebări</div>
    </div>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home">
    <div class="exam-cta">
      <div class="info">
        <h2>Examen personalizat</h2>
        <div class="meta">Alege ce colecții intră în test</div>
      </div>
      <div class="action">
        <button class="btn-primary" id="btn-open-exam-setup">Examen</button>
      </div>
    </div>
    <div class="collections" id="collections-list"></div>
  </div>

  <!-- EXAM SETUP SCREEN -->
  <div id="screen-exam-setup" class="hidden">
    <div class="exam-toolbar">
      <div class="links">
        <button class="btn-text" id="btn-exam-select-all">Selectează tot</button>
        <button class="btn-text" id="btn-exam-select-none">Deselectează tot</button>
      </div>
      <button class="btn-text" id="btn-exam-cancel">Anulează</button>
    </div>
    <div class="exam-list" id="exam-list"></div>
    <div class="exam-footer">
      <div class="meta" id="exam-selection-summary" style="color: var(--text-dim); font-size: 0.87rem;"></div>
      <button class="btn-primary" id="btn-exam-generate" disabled>Generează examenul</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-header">
      <div class="progress-label" id="quiz-progress-label"></div>
      <button class="btn-text" id="btn-exit">Acasă</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="question-card">
      <p class="question-text" id="question-text"></p>
      <div class="question-image hidden" id="question-image">
        <img id="question-image-img" src="" alt="Imagine întrebare">
      </div>
      <p class="question-hint" id="question-hint">Poți alege una sau mai multe variante.</p>
      <div class="options" id="options-list"></div>
      <button type="button" class="btn-secondary btn-expl hidden" id="btn-expl-toggle">Vezi explicația</button>
      <div class="explanation-box hidden" id="explanation-box">
        <span class="label">Explicație</span><div id="explanation-text" class="expl-body"></div><div id="explanation-allvars" class="expl-allvars hidden"></div><div id="explanation-source" class="expl-source hidden"></div><div id="explanation-keynote" class="expl-keynote hidden"></div>
      </div>
    </div>

    <div class="quiz-actions">
      <button class="btn-secondary" id="btn-prev">Înapoi</button>
      <button class="btn-primary" id="btn-check">Verifică</button>
      <button class="btn-secondary" id="btn-next">Înainte</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="hidden">
    <div class="results-card">
      <div class="results-label" id="results-collection-name"></div>
      <div class="results-score"><span id="results-score-num">0</span><span> / <span id="results-score-total">0</span> corecte</span></div>
      <div class="results-breakdown">
        <div><b id="results-correct">0</b>corecte</div>
        <div><b id="results-wrong">0</b>greșite</div>
        <div><b id="results-unanswered">0</b>nefăcute</div>
      </div>
      <div class="results-actions">
        <button class="btn-primary" id="btn-redo-all">Reia testul integral</button>
        <button class="btn-secondary" id="btn-redo-mistakes">Reia doar greșite / nefăcute</button>
        <button class="btn-text" id="btn-results-exit">Înapoi la colecții</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   DATE TESTE
   -------------------------------------------------------------------------
   Fiecare colecție are un id unic, un titlu și o listă de întrebări.
   O întrebare are: id unic (în cadrul colecției), text, și o listă "options",
   fiecare opțiune fiind { text: "...", correct: true/false }. O întrebare
   poate avea una SAU mai multe variante corecte.
   ========================================================================= */

const STORAGE_KEY = "quiz-epi-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveProgress(progress) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    /* localStorage indisponibil — progresul nu va persista, dar aplicația funcționează */
  }
}

let progress = loadProgress();
let examProgressStore = {};

function getCollectionProgress(collectionId) {
  const store = state.isExam ? examProgressStore : progress;
  if (!store[collectionId]) store[collectionId] = {};
  return store[collectionId];
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSession(questions) {
  return shuffleArray(questions).map(q => ({
    id: q.id,
    text: q.text,
    options: shuffleArray(q.options),
    explanation: q.explanation || "",
    source: q.source || "",
    keynote: q.keynote || "",
    allvars: q.allvars || "",
    image: q.image || null
  }));
}

// ---- state ----
let state = {
  collection: null,
  session: null,      // array of question objects for the current run
  index: 0,
  selected: [],        // indices of options chosen for the current question
  checked: false,
  isExam: false
};

const screens = {
  home: document.getElementById("screen-home"),
  examSetup: document.getElementById("screen-exam-setup"),
  quiz: document.getElementById("screen-quiz"),
  results: document.getElementById("screen-results")
};

function showScreen(name) {
  Object.keys(screens).forEach(k => screens[k].classList.toggle("hidden", k !== name));
}

function setHeader(title, sub) {
  document.getElementById("page-title").textContent = title;
  document.getElementById("page-sub").textContent = sub;
}

// HOME

function renderHome() {
  state.isExam = false;
  setHeader("Teste Epidemiologie", "Alege o colecție de întrebări, grupate pe teme");
  const list = document.getElementById("collections-list");
  list.innerHTML = "";

  if (COLLECTIONS.length === 0) {
    list.innerHTML = '<div class="empty-state">Nu există încă nicio colecție de teste.</div>';
    return;
  }

  let lastGroup = null, lastSection = null;
  COLLECTIONS.forEach(col => {
    if (col.section && col.section !== lastSection) {
      lastSection = col.section; lastGroup = null;
      const sh = document.createElement("h2");
      sh.className = "section-title";
      sh.textContent = col.section;
      list.appendChild(sh);
    }
    if (col.group && col.group !== lastGroup) {
      lastGroup = col.group;
      const gh = document.createElement("h3");
      gh.className = "group-title";
      gh.textContent = col.group;
      list.appendChild(gh);
    }
    const cp = getCollectionProgress(col.id);
    const total = col.questions.length;
    const answered = Object.keys(cp).length;
    const correct = Object.values(cp).filter(a => a.correct).length;

    let metaText = total + " de întrebări";
    let buttonText = "Începe";
    if (answered > 0) {
      metaText += " · " + correct + "/" + total + " corecte până acum";
      buttonText = answered >= total ? "Reia" : "Continuă";
    }

    const card = document.createElement("div");
    card.className = "collection-card";
    card.innerHTML = `
      <div class="info">
        <h2>${escapeHtml(col.title)}</h2>
        <div class="meta">${metaText}</div>
      </div>
      <div class="action">
        <button class="btn-primary btn-start">${buttonText}</button>
      </div>
    `;
    card.querySelector(".btn-start").addEventListener("click", () => startCollection(col));
    list.appendChild(card);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// QUIZ
// ---------------------------------------------------------------------

function startCollection(col, questionSubset) {
  state.collection = col;
  state.session = buildSession(questionSubset || col.questions);
  state.index = 0;
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = state.session[state.index];
  const cp = getCollectionProgress(state.collection.id);
  const saved = cp[q.id];

  state.selected = saved ? saved.selected.slice() : [];
  state.checked = !!saved;

  document.getElementById("quiz-progress-label").textContent =
    "Întrebarea " + (state.index + 1) + " din " + state.session.length + " — " + state.collection.title;
  document.getElementById("progress-fill").style.width =
    Math.round(((state.index) / state.session.length) * 100) + "%";

  document.getElementById("question-text").textContent = q.text;

  const imgWrap = document.getElementById("question-image");
  const imgEl = document.getElementById("question-image-img");
  if (q.image) {
    imgEl.src = q.image;
    imgWrap.classList.remove("hidden");
  } else {
    imgEl.src = "";
    imgWrap.classList.add("hidden");
  }

  const isSingle = q.options.filter(o => o.correct).length === 1;
  document.getElementById("question-hint").textContent = isSingle
    ? "Alege o singură variantă."
    : "Poți alege una sau mai multe variante.";

  const optsWrap = document.getElementById("options-list");
  optsWrap.innerHTML = "";
  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = '<span class="option-row"><span class="option-box' + (isSingle ? ' round' : '') + '">✓</span><span></span></span>';
    btn.querySelector(".option-row > span:last-child").textContent = opt.text;
    btn.addEventListener("click", () => selectOption(i));
    optsWrap.appendChild(btn);
  });

  document.getElementById("btn-prev").disabled = state.index === 0;
  document.getElementById("btn-next").textContent =
    state.index === state.session.length - 1 ? "Finalizează" : "Înainte";

  applyOptionStyles();
}

function selectOption(i) {
  if (state.checked) return; // already verified, locked until moving to another question
  const q = state.session[state.index];
  const isSingle = q.options.filter(o => o.correct).length === 1;
  if (isSingle) {
    state.selected = [i];
  } else {
    const pos = state.selected.indexOf(i);
    if (pos === -1) state.selected.push(i);
    else state.selected.splice(pos, 1);
  }
  applyOptionStyles();
}

const explOpened = new Set();
function applyOptionStyles() {
  const q = state.session[state.index];
  const opts = document.querySelectorAll("#options-list .option");
  opts.forEach((btn, i) => {
    btn.classList.remove("selected", "correct", "incorrect", "missed");
    btn.disabled = state.checked;
    const isSelected = state.selected.includes(i);
    const isCorrectOpt = q.options[i].correct;
    if (state.checked) {
      if (isCorrectOpt && isSelected) btn.classList.add("correct");
      else if (isCorrectOpt && !isSelected) btn.classList.add("missed");
      else if (!isCorrectOpt && isSelected) btn.classList.add("incorrect");
    } else if (isSelected) {
      btn.classList.add("selected");
    }
  });
  document.getElementById("btn-check").disabled = state.checked;

  const explBox = document.getElementById("explanation-box");
  const exTgl = document.getElementById("btn-expl-toggle");
  const answeredRight = state.checked && isAnswerCorrect(q, state.selected);
  const showExpl = state.checked && q.explanation && (!answeredRight || explOpened.has(q.id));
  if (state.checked && q.explanation && answeredRight) {
    exTgl.textContent = explOpened.has(q.id) ? "Ascunde explicația" : "Vezi explicația";
    exTgl.classList.remove("hidden");
  } else { exTgl.classList.add("hidden"); }
  if (showExpl) {
    document.getElementById("explanation-text").innerHTML = renderExplanation(q.explanation);
    const avEl = document.getElementById("explanation-allvars");
    if (q.allvars) { avEl.innerHTML = '<div class="expl-allvars-title">Toate variantele care pot fi corecte la examen</div><div class="expl-allvars-sub">inclusiv cele care nu apar în acest test</div>' + renderExplanation(q.allvars); avEl.classList.remove("hidden"); }
    else { avEl.innerHTML = ""; avEl.classList.add("hidden"); }
    const srcEl = document.getElementById("explanation-source");
    if (q.source) { srcEl.innerHTML = '<span class="expl-tag">Sursa:</span> ' + explInline(q.source); srcEl.classList.remove("hidden"); }
    else { srcEl.innerHTML = ""; srcEl.classList.add("hidden"); }
    const knEl = document.getElementById("explanation-keynote");
    if (q.keynote) { knEl.innerHTML = '<span class="expl-tag">Notă la cheie:</span> ' + explInline(q.keynote); knEl.classList.remove("hidden"); }
    else { knEl.innerHTML = ""; knEl.classList.add("hidden"); }
    explBox.classList.remove("hidden");
  } else {
    explBox.classList.add("hidden");
  }
}

function explInline(s) {
  const parts = escapeHtml(s).split(/(\*+)/);
  const stack = [];
  let out = "";
  const toggle = (t) => {
    const pos = stack.lastIndexOf(t);
    if (pos === -1) { out += "<" + t + ">"; stack.push(t); return; }
    const reopen = stack.splice(pos + 1);
    for (let k = reopen.length - 1; k >= 0; k--) out += "</" + reopen[k] + ">";
    out += "</" + t + ">"; stack.pop();
    for (const r of reopen) { out += "<" + r + ">"; stack.push(r); }
  };
  for (const part of parts) {
    if (!/^\*+$/.test(part)) { out += part; continue; }
    if (part.length === 1) toggle("em");
    else if (part.length === 2) toggle("strong");
    else if (stack.includes("em")) { toggle("em"); toggle("strong"); }
    else { toggle("strong"); toggle("em"); }
  }
  while (stack.length) out += "</" + stack.pop() + ">";
  return out;
}

function renderExplanation(md) {
  const lines = String(md || "").split("\n");
  let html = "";
  const stack = []; // {tag, level}
  const closeList = () => { const t = stack.pop(); html += "</li></" + t.tag + ">"; };
  const closeAll = () => { while (stack.length) closeList(); };
  for (const raw of lines) {
    if (!raw.trim()) { closeAll(); continue; }
    const indent = raw.match(/^ */)[0].length;
    const line = raw.trim();
    let m, tag = null, content = null;
    if ((m = line.match(/^[-•]\s+(.*)$/))) { tag = "ul"; content = m[1]; }
    else if ((m = line.match(/^(\d+)[.)]\s+(.*)$/))) { tag = "ol"; content = m[2]; }
    if (tag) {
      const level = Math.min(2, Math.floor(indent / 2));
      while (stack.length && stack[stack.length - 1].level > level) closeList();
      const top = stack[stack.length - 1];
      if (top && top.level === level) {
        if (top.tag === tag) { html += "</li>"; }
        else { closeList(); html += "<" + tag + ">"; stack.push({ tag, level }); }
      } else {
        html += "<" + tag + ">"; stack.push({ tag, level });
      }
      html += "<li>" + explInline(content);
    } else if (indent > 0 && stack.length) {
      html += '<div class="expl-cont">' + explInline(line) + "</div>";
    } else {
      closeAll();
      html += "<p>" + explInline(line) + "</p>";
    }
  }
  closeAll();
  return html;
}

function isAnswerCorrect(q, selected) {
  const correctIdx = q.options.map((o, i) => o.correct ? i : -1).filter(i => i !== -1);
  if (correctIdx.length !== selected.length) return false;
  const sortedSel = selected.slice().sort();
  const sortedCorrect = correctIdx.slice().sort();
  return sortedSel.every((v, i) => v === sortedCorrect[i]);
}

function persistIfNeeded() {
  if (!state.isExam) saveProgress(progress);
}

document.getElementById("btn-expl-toggle").addEventListener("click", () => {
  const q = state.session[state.index];
  if (explOpened.has(q.id)) explOpened.delete(q.id); else explOpened.add(q.id);
  applyOptionStyles();
});
document.getElementById("btn-check").addEventListener("click", () => {
  if (state.checked) return;
  const q = state.session[state.index];
  const cp = getCollectionProgress(state.collection.id);
  // Dacă nu a fost aleasă nicio variantă, întrebarea se marchează automat ca greșită.
  cp[q.id] = { selected: state.selected.slice(), correct: isAnswerCorrect(q, state.selected) };
  persistIfNeeded();
  state.checked = true;
  applyOptionStyles();
});

document.getElementById("btn-prev").addEventListener("click", () => {
  if (state.index === 0) return;
  state.index -= 1;
  renderQuestion();
});

document.getElementById("btn-next").addEventListener("click", () => {
  if (state.index === state.session.length - 1) {
    showResults();
  } else {
    state.index += 1;
    renderQuestion();
  }
});

document.getElementById("btn-exit").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

function showResults() {
  const col = state.collection;
  const cp = getCollectionProgress(col.id);
  const total = col.questions.length;
  let correct = 0, wrong = 0;
  col.questions.forEach(q => {
    const a = cp[q.id];
    if (a) { a.correct ? correct++ : wrong++; }
  });
  const unanswered = total - correct - wrong;

  document.getElementById("results-collection-name").textContent = col.title;
  document.getElementById("results-score-num").textContent = correct;
  document.getElementById("results-score-total").textContent = total;
  document.getElementById("results-correct").textContent = correct;
  document.getElementById("results-wrong").textContent = wrong;
  document.getElementById("results-unanswered").textContent = unanswered;

  const redoMistakesBtn = document.getElementById("btn-redo-mistakes");
  redoMistakesBtn.disabled = (wrong + unanswered) === 0;
  redoMistakesBtn.style.display = (wrong + unanswered) === 0 ? "none" : "block";

  setHeader("Teste Academic Hub", "Rezultatele tale");
  showScreen("results");
}

document.getElementById("btn-redo-all").addEventListener("click", () => {
  const col = state.collection;
  if (state.isExam) {
    examProgressStore[col.id] = {};
  } else {
    progress[col.id] = {};
    saveProgress(progress);
  }
  startCollection(col);
});

document.getElementById("btn-redo-mistakes").addEventListener("click", () => {
  const col = state.collection;
  const cp = getCollectionProgress(col.id);
  const subset = col.questions.filter(q => !cp[q.id] || !cp[q.id].correct);
  if (subset.length === 0) return;
  // Ștergem răspunsurile anterioare ale acestor întrebări, ca să poată fi reluate ca test, nu doar afișate ca deja verificate.
  subset.forEach(q => { delete cp[q.id]; });
  persistIfNeeded();
  startCollection(col, subset);
});

document.getElementById("btn-results-exit").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

// ---------------------------------------------------------------------
// EXAM SETUP
// ---------------------------------------------------------------------

let examSelection = new Set();

document.getElementById("btn-open-exam-setup").addEventListener("click", () => {
  examSelection = new Set();
  renderExamSetup();
  showScreen("examSetup");
  setHeader("Examen personalizat", "Alege ce colecții vrei să includă examenul");
});

document.getElementById("btn-exam-cancel").addEventListener("click", () => {
  showScreen("home");
  renderHome();
});

document.getElementById("btn-exam-select-all").addEventListener("click", () => {
  COLLECTIONS.forEach(c => examSelection.add(c.id));
  renderExamSetup();
});

document.getElementById("btn-exam-select-none").addEventListener("click", () => {
  examSelection.clear();
  renderExamSetup();
});

function renderExamSetup() {
  const list = document.getElementById("exam-list");
  list.innerHTML = "";
  COLLECTIONS.forEach(col => {
    const item = document.createElement("div");
    item.className = "exam-item";
    const checked = examSelection.has(col.id);
    item.innerHTML = `
      <span class="option-box${checked ? ' selected' : ''}" style="border-color: ${checked ? 'var(--accent)' : 'var(--text-dim)'}; background: ${checked ? 'var(--accent)' : 'transparent'}; color: ${checked ? 'var(--accent-text)' : 'transparent'};">✓</span>
      <span>
        <div class="exam-item-title">${escapeHtml(col.title)}</div>
        <div class="exam-item-meta">${col.questions.length} de întrebări</div>
      </span>
    `;
    item.addEventListener("click", () => {
      if (examSelection.has(col.id)) examSelection.delete(col.id);
      else examSelection.add(col.id);
      renderExamSetup();
    });
    list.appendChild(item);
  });

  const count = examSelection.size;
  const totalQuestions = COLLECTIONS.filter(c => examSelection.has(c.id))
    .reduce((sum, c) => sum + c.questions.length, 0);
  document.getElementById("exam-selection-summary").textContent =
    count === 0 ? "Nicio colecție selectată" : count + " colecții selectate · " + totalQuestions + " întrebări";
  document.getElementById("btn-exam-generate").disabled = count === 0;
}

document.getElementById("btn-exam-generate").addEventListener("click", () => {
  const selectedCols = COLLECTIONS.filter(c => examSelection.has(c.id));
  if (selectedCols.length === 0) return;
  const allQuestions = [];
  selectedCols.forEach(c => allQuestions.push(...c.questions));

  const examCollection = {
    id: "examen",
    title: "Examen (" + selectedCols.length + " colecții, " + allQuestions.length + " întrebări)",
    questions: allQuestions
  };

  examProgressStore = { examen: {} };
  state.isExam = true;
  startCollection(examCollection);
});

// ---------------------------------------------------------------------
renderHome();
showScreen("home");
</script>
